[package]
name = "imposter"
description = "Imposter desktop HTTP client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
imposter-app.workspace = true
imposter-ui.workspace = true
eframe.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
egui.workspace = true

# Packaging with cargo-packager (docs/release.md): `cargo packager -p imposter --release`.
[package.metadata.packager]
product-name = "Imposter"
# Confirm before the first signed release: identifiers cannot change without losing settings
# and notarization history.
identifier = "dev.imposter.app"
publisher = "Imposter"
category = "DeveloperTool"
description = "A local desktop HTTP API client."
before-packaging-command = "cargo build --release --locked -p imposter"
out-dir = "../../target/packages"
binaries-dir = "../../target/release"
binaries = [{ path = "imposter", main = true }]
icons = [
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/256x256.png",
    "icons/512x512.png",
    "icons/512x512@2x.png",
]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# Ad-hoc signature ("-") unless the release workflow substitutes a Developer ID: without a
# signature over the whole bundle, a downloaded app is reported as "damaged" and cannot be
# opened at all.
signing-identity = "-"

[package.metadata.packager.deb]
# Loaded at runtime (winit, glutin); file dialogs go through the XDG desktop portal.
depends = ["libgl1", "libegl1", "libx11-6", "libxcursor1", "libxi6", "libxrandr2", "libxkbcommon0", "libxkbcommon-x11-0"]

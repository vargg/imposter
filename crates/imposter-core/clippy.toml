# imposter-core does no IO (AGENTS.md). Clippy uses only the nearest clippy.toml, so the root
# settings are repeated here.
allow-unwrap-in-tests = true

disallowed-types = [
    { path = "std::fs::File", reason = "imposter-core does no IO" },
    { path = "std::net::TcpStream", reason = "imposter-core does no IO" },
    { path = "std::net::TcpListener", reason = "imposter-core does no IO" },
    { path = "std::net::UdpSocket", reason = "imposter-core does no IO" },
    { path = "std::time::Instant", reason = "imposter-core reads no clock; take time as input" },
    { path = "std::time::SystemTime", reason = "imposter-core reads no clock; take time as input" },
]
disallowed-methods = [
    { path = "std::fs::read", reason = "imposter-core does no IO" },
    { path = "std::fs::read_to_string", reason = "imposter-core does no IO" },
    { path = "std::fs::write", reason = "imposter-core does no IO" },
    { path = "std::fs::read_dir", reason = "imposter-core does no IO" },
    { path = "std::fs::metadata", reason = "imposter-core does no IO" },
    { path = "std::env::var", reason = "imposter-core reads no environment" },
    { path = "std::env::var_os", reason = "imposter-core reads no environment" },
    { path = "std::thread::sleep", reason = "imposter-core does no IO" },
]

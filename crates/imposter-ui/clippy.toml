# imposter-ui never blocks the UI thread (AGENTS.md): database and file work goes through the
# bridge, file dialogs are async. Clippy uses only the nearest clippy.toml, so the root
# settings are repeated here. Tests and examples drive the app from outside its event loop
# and allow these lints at their top.
allow-unwrap-in-tests = true

disallowed-methods = [
    { path = "imposter_store::StoreHandle::call_blocking", reason = "blocks the UI thread; run database work with ImposterApp::task" },
    { path = "imposter_app::runtime::Bridge::wait_idle", reason = "blocks the UI thread" },
    { path = "std::thread::sleep", reason = "blocks the UI thread; use request_repaint_after" },
    { path = "tokio::runtime::Runtime::block_on", reason = "blocks the UI thread; spawn on the bridge" },
    { path = "std::fs::read", reason = "file IO blocks the UI thread; do it on the bridge" },
    { path = "std::fs::read_to_string", reason = "file IO blocks the UI thread; do it on the bridge" },
    { path = "std::fs::write", reason = "file IO blocks the UI thread; do it on the bridge" },
    { path = "std::fs::read_dir", reason = "file IO blocks the UI thread; do it on the bridge" },
    { path = "std::fs::metadata", reason = "file IO blocks the UI thread; do it on the bridge" },
    { path = "std::fs::create_dir_all", reason = "file IO blocks the UI thread; do it on the bridge" },
    { path = "std::fs::File::open", reason = "file IO blocks the UI thread; do it on the bridge" },
    { path = "std::fs::File::create", reason = "file IO blocks the UI thread; do it on the bridge" },
]
disallowed-types = [
    { path = "rfd::FileDialog", reason = "a synchronous dialog blocks the UI thread; use rfd::AsyncFileDialog through ImposterApp::pick" },
    { path = "rfd::MessageDialog", reason = "a synchronous dialog blocks the UI thread; use a Dialog" },
]

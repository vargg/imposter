[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
imposter-core = { path = "crates/imposter-core" }
imposter-http = { path = "crates/imposter-http" }
imposter-store = { path = "crates/imposter-store" }
imposter-transfer = { path = "crates/imposter-transfer" }
imposter-app = { path = "crates/imposter-app" }
imposter-ui = { path = "crates/imposter-ui" }
imposter-testkit = { path = "crates/imposter-testkit" }

# Third-party. Versions live only here (see AGENTS.md).
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "accesskit", "clipboard"] }
egui = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false }
egui_kittest = { version = "0.37.0", features = ["eframe"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# PBKDF2-HMAC-SHA1 is the default PRF of LibreSSL and OpenSSL < 1.1 encrypted keys; SHA-1 is
# only a KDF there, where its collision weakness does not apply.
md-5 = "0.11.0"
mime_guess = "2.0.5"
pkcs5 = { version = "0.8.1", features = ["sha1-insecure"] }
pkcs8 = { version = "0.11.0", features = ["encryption", "pem", "std", "getrandom"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "gzip", "deflate", "brotli"] }
rfd = "0.17.2"
rusqlite = { version = "0.41.0", features = ["bundled", "backup"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
rustls-platform-verifier = "0.7.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
getrandom = "0.4.3"
image = { version = "0.25", default-features = false, features = ["png"] }
jsonschema = { version = "0.60.1", default-features = false }
url = "2.5.8"
jiff = "0.2.38"
indexmap = { version = "2.14.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "fs"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Selective pedantic allows. Add new ones here with a reason, not per crate.
module_name_repetitions = "allow" # crate-prefixed type names read better at call sites
must_use_candidate = "allow"      # too noisy for small getters
missing_errors_doc = "allow"      # error enums document themselves
struct_excessive_bools = "allow"  # settings and options mirror independent user toggles
too_many_lines = "allow"          # dispatch matches and UI layouts read best whole; length alone is no defect
# Restriction lints backing the rules in AGENTS.md.
unwrap_used = "deny"   # tests are exempt via clippy.toml
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
# Keep unwinding: a panic inside one background task must not take the whole app down.
panic = "unwind"
